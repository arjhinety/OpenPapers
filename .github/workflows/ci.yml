name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  deterministic:
    name: Deterministic checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high
  docker-integration:
    name: Docker integration
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.yml -f docker-compose.integration.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up --build --wait
      - run: npm ci
      - run: npm run test:postgres
      - name: Check service state
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml ps
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v
  live-evals:
    name: Live provider evaluations (scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      - name: Upload live evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results-${{ github.run_id }}
          path: evals/results/live-search-reliability-*.json
          if-no-files-found: warn
